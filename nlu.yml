version: "3.1"

nlu:
- intent: ask_place
  examples: |
    - سی و سه پل کجاست؟
    - میدان نقش جهان چه ویژگی‌هایی داره؟
    - درباره چهل ستون بگو
    - جاهای دیدنی اصفهان چیه؟

- intent: ask_restaurant
  examples: |
    - رستوران سنتی معروف در اصفهان کجاست؟
    - کجا بریانی بخورم؟
    - یه غذای خوشمزه تو اصفهان کجا پیدا می‌شه؟

- intent: ask_tour
  examples: |
    - تور اصفهان دارین؟
    - چطوری تور رزرو کنم؟
    - تور امروز اصفهان چیه؟

- intent: ask_culture
  examples: |
    - فرهنگ اصفهان چطوریه؟
    - صنایع دستی اصفهان چیا هستن؟
    - مینیاتور یعنی چی؟

- intent: ask_services
  examples: |
    - خدمات گردشگری شما چیه؟
    - راهنمای تور دارین؟
    - رزرو اقامت هم دارید؟

- intent: out_of_scope
  examples: |
    - بیت‌کوین چیه؟
    - بهترین گوشی چیه؟
    - من اهل شیرازم
    - پایتون چطوری کار می‌کنه؟
